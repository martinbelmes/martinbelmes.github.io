<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>ACIDA REVISTA</title>
	<link rel="icon" href="/logo.png" type="image/png">
	<style>
		/* Make the page use the full viewport and avoid scroll */
		html,body{height:100%;}
		body{background:#111;font-family:Segoe UI,Arial,Helvetica,sans-serif;margin:0;display:flex;flex-direction:column;align-items:center;overflow:hidden}

		/* PDF container fills the viewport (you can keep a small gap if desired)
		   Here the container uses full height so the canvas will fit inside */
		#pdf-container{width:100%;height:100vh;box-shadow:0 2px 8px rgba(0,0,0,0.1);padding:0;background:black;border-radius:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
		#pdf-wrapper{position:relative;display:block;width:100%;height:100%}

		/* Canvas uses full height of the wrapper while keeping aspect ratio */
		canvas{display:block;margin:0 auto;width:auto;height:100%;max-height:100%;}

		/* Overlay sits on top of the canvas and will receive pointer events when buttons exist */
		#overlay{position:absolute;left:0;top:0;pointer-events:auto}

		/* Visual style for overlay buttons (visible and touch-friendly) */
		.overlay-btn{position:absolute;display:inline-block;padding:4px 8px;border-radius:6px;background:rgba(0,90,158,0.12);color:#fff;border:1px solid rgba(255,255,255,0.06);font-size:13px;text-align:center}
		.overlay-btn:focus,.overlay-btn:hover{background:rgba(0,90,158,0.22);outline:none}

		/* Hidden static buttons (kept for fallback) */
		#buttons{position:fixed;right:12px;top:12px;display:flex;gap:8px;z-index:40}
		#buttons button{background:#005a9e;color:#fff;border:none;padding:8px 10px;border-radius:6px;cursor:pointer}
	</style>
</head>
<body>
	<div id="pdf-container">
		<div id="pdf-wrapper">
			<canvas id="pdf-canvas" aria-label="Imagen de la página 1 de portada.pdf"></canvas>
			<div id="overlay" aria-hidden="false" style="position:absolute;left:0;top:0;"></div>
		</div>
	</div>

	<div id="buttons" style="display:none">
		<button id="btn-edit" data-href="./edicion1.html">Edicion Express</button>
		<button id="btn-numeros" data-href="./edicion2.html">Numeros</button>
		<button id="btn-redes" data-href="https://www.instagram.com/acidarevista/">Nuestras redes</button>
	</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
	<script>
		const url = 'portada.pdf';
		const canvas = document.getElementById('pdf-canvas');
		const ctx = canvas.getContext('2d');

		pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

		pdfjsLib.getDocument(url).promise
			.then(pdf => pdf.getPage(1))
			.then(page => {
						// scale to fit container width
									// determine container size (CSS pixels)
									const containerEl = document.getElementById('pdf-wrapper');
									const containerWidth = containerEl.clientWidth;
									const containerHeight = containerEl.clientHeight;
									const unscaledViewport = page.getViewport({scale: 1});
									// prefer to scale so the PDF fills the available height
									let scaleByHeight = containerHeight / unscaledViewport.height;
									let scaleByWidth = containerWidth / unscaledViewport.width;
									// try to fill height, but if that overflows width, use width instead
									let scale = scaleByHeight;
									if (unscaledViewport.width * scale > containerWidth) scale = scaleByWidth;
									// viewport in CSS pixels (used for positioning overlay/buttons)
									const viewport = page.getViewport({scale});
									// handle high DPI displays: render at devicePixelRatio for crisp canvas
									const DPR = window.devicePixelRatio || 1;
									const renderViewport = page.getViewport({scale: scale * DPR});
									canvas.width = Math.round(renderViewport.width);
									canvas.height = Math.round(renderViewport.height);
									canvas.style.width = Math.round(viewport.width) + 'px';
									canvas.style.height = Math.round(viewport.height) + 'px';
									const renderContext = {canvasContext: ctx, viewport: renderViewport};
									const renderTask = page.render(renderContext);

									renderTask.promise.then(() => {
										// prepare overlay same size and position as canvas (in CSS pixels)
										const overlay = document.getElementById('overlay');
										// canvas.style.width/height hold CSS sizes (e.g. "600px")
										overlay.style.width = canvas.style.width;
										overlay.style.height = canvas.style.height;
										// canvas may be centered in the wrapper; align overlay to canvas top-left
										// compute offset of canvas relative to its offsetParent (pdf-wrapper)
										const canvasOffsetLeft = canvas.offsetLeft || 0;
										const canvasOffsetTop = canvas.offsetTop || 0;
										overlay.style.left = canvasOffsetLeft + 'px';
										overlay.style.top = canvasOffsetTop + 'px';
										overlay.style.zIndex = 5;
										overlay.style.pointerEvents = 'none';

							// labels to place and whether already placed
							const targets = {
								edit: {keywords: ['edicion', 'edición', 'edicion express'], placed: false, label: 'Edicion Express', id: 'btn-edit'},
								numeros: {keywords: ['numero', 'número', 'numeros', 'números'], placed: false, label: 'Numeros', id: 'btn-numeros'},
								redes: {keywords: ['red', 'redes', 'nuestras redes'], placed: false, label: 'Nuestras redes', id: 'btn-redes'}
							};

							// get text content to find positions
							page.getTextContent().then(textContent => {
								const items = textContent.items;
								for (let i = 0; i < items.length; i++) {
									const item = items[i];
									const str = (item.str || '').toLowerCase().trim();
									// check each target
									for (const key in targets) {
										if (targets[key].placed) continue;
										const t = targets[key];
										// if any keyword is included in this item
										if (t.keywords.some(k => str.includes(k))) {
											// compute transform to viewport coordinates
											// use the CSS-pixel viewport for positioning so overlay aligns with displayed canvas
											const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
											// tx[4], tx[5] are x,y in CSS pixels for the displayed viewport
											const x = tx[4];
											const y = tx[5];
											// approximate font height in CSS pixels
											const fontHeight = Math.hypot(tx[2], tx[3]) || 12;
											const left = x;
											const top = Math.round(viewport.height - y - fontHeight);

											// approximate text width (item.width available from pdf.js text item) in CSS pixels
											const itemWidth = (item.width || 0);
											const textWidth = Math.max( Math.round(itemWidth * scale), 30 );

											// create visible overlay button that covers the whole text area (CSS pixels)
											const btn = document.createElement('button');
											btn.className = 'overlay-btn';
											btn.textContent = t.label;
											btn.id = t.id;
											// position inside overlay (which is absolute at 0,0 and matches canvas CSS size)
											btn.style.left = Math.round(left) + 'px';
											btn.style.top = top + 'px';
											btn.style.width = textWidth + 'px';
											btn.style.height = Math.max( Math.round(fontHeight), 20) + 'px';
											btn.style.lineHeight = Math.max( Math.round(fontHeight), 20) + 'px';
											btn.style.pointerEvents = 'auto';
                                            btn.style.color = 'transparent';
                                            btn.style.backgroundColor = 'transparent';
											// ensure overlay receives pointer events now that there are buttons
											overlay.style.pointerEvents = 'auto';

											// click handlers: redireccionar según el botón
											btn.addEventListener('click', (e) => {
												e.stopPropagation();
												if (t.id === 'btn-edit') {
													location.href = 'https://www.instagram.com/acidarevista/';
													return;
												}
												if (t.id === 'btn-numeros') {
													location.href = 'edicion1.html';
													return;
												}
												if (t.id === 'btn-redes') {
													location.href = 'edicion2.html';
													return;
												}
											});

											overlay.appendChild(btn);
											t.placed = true;
										}
									}
								}
							}).catch(err => console.warn('No se pudo leer texto del PDF:', err));
						});

							// add simple resize handling so mobile orientation changes re-render
							let resizeTimer = null;
							window.addEventListener('resize', () => {
								if (resizeTimer) clearTimeout(resizeTimer);
								resizeTimer = setTimeout(() => {
									// remove existing overlay buttons
									const overlay = document.getElementById('overlay');
									overlay.innerHTML = '';
									// re-run render by calling the same sequence: request the page again
									page.cleanup && page.cleanup();
									// simple approach: reload the page to reinitialize PDF render
									location.reload();
								}, 300);
							});
			})
			.catch(err => {
				const container = document.getElementById('pdf-container');
				container.innerHTML = '<p style="color:#900">No se pudo cargar <code>portada.pdf</code>: ' + (err.message || err) + '</p>';
			});
	</script>
</body>
</html>
