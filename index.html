<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACIDA REVISTA</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #111; /* Dark background matching the theme */
      }

      /* Container to center and contain the content */
      .container {
        position: relative;
        width: 100%;
        height: 100vh; /* Full viewport height */
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      /* Image Wrapper to hold image and hitboxes */
      .image-wrapper {
        position: relative;
        max-width: 100%;
        max-height: 100%;
      }

      /* The actual images */
      .image-wrapper img {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100vh;
        object-fit: contain;
      }

      /* Toggle desktop/mobile visibility */
      .desktop-view {
        display: block;
      }
      .mobile-view {
        display: none;
      }

      @media (max-width: 768px) {
        .desktop-view {
          display: none;
        }
        .mobile-view {
          display: block;
        }
      }

      /* HITBOX STYLES */
      .hitbox {
        position: absolute;
        display: block;
        z-index: 10;
        cursor: pointer;

        /* Debug styles removed */
        background-color: transparent; /* Ensure transparent background */
        -webkit-tap-highlight-color: transparent; /* Remove mobile tap highlight if desired */
      }



      /* 
         * ADJUST THESE PERCENTAGES TO MOVE THE HITBOXES 
         * Top/Left = position
         * Width/Height = size
         */

      /* --- DESKTOP HITBOXES --- */
      /* Primera Edición Vómito - Initial guess based on mobile style */
      #d-edicion1 {
        top: 11%;
        left: 19%;
        width: 40%;
        height: 19%;
        transform: rotate(-20deg); /* Reduced rotation for desktop usually */
      }

      /* Edición Exprés */
      #d-edicion2 {
        top: 40%;
        left: 21%;
        width: 59%;
        height: 17%;
      }

      /* Todos los articulos */
      #d-substack {
        top: 66%;
        left: 22%;
        width: 41%;
        height: 22%;
        transform: rotate(17deg);
      }

      /* Nuestras Redes */
      #d-instagram {
        top: 74%;
        left: 7%;
        width: 15%;
        height: 29%;
        transform: rotate(-110deg);
      }

      /* --- MOBILE HITBOXES --- */
      /* --- MOBILE HITBOXES --- */
      /* Primera Edición Vómito - Expanded upwards */
      #m-edicion1 {
        top: 15%;
        left: 10%;
        width: 80%;
        height: 15%;
        transform: rotate(-40deg);
      }

      /* Edición Exprés - Trimmed from left */
      #m-edicion2 {
        top: 40%;
        left: 20%;
        width: 70%;
        height: 15%;
      }

      /* Todos los articulos - Less width, expand down */
      #m-substack {
        top: 65%;
        left: 10%;
        width: 70%;
        height: 15%;
        transform: rotate(40deg);
      }

      /* Nuestras Redes - Moved right */
      #m-instagram {
        top: 85%;
        left: 0%; /* Moved right from -15% */
        width: 40%;
        height: 14%;
        transform: rotate(-110deg);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- DESKTOP VIEW -->
      <div class="image-wrapper desktop-view">
        <img src="inicio web_Mesa de trabajo.png" alt="Inicio Desktop" />

        <a
          href="edicion1.html"
          class="hitbox"
          id="d-edicion1"
          title="Primera edición vómito"
        ></a>
        <a
          href="edicion2.html"
          class="hitbox"
          id="d-edicion2"
          title="Edición exprés"
        ></a>
        <a
          href="https://substack.com/@acidarevista?utm_source=global-search"
          class="hitbox"
          id="d-substack"
          title="Todos los artículos"
        ></a>
        <a
          href="https://www.instagram.com/acidarevista?igsh=MXVxbm43YmwwbGpocQ=="
          class="hitbox"
          id="d-instagram"
          title="Nuestras redes"
        ></a>
      </div>

      <!-- MOBILE VIEW -->
      <div class="image-wrapper mobile-view">
        <img src="inicio movil_Mesa de trabajo.png" alt="Inicio Móvil" />

        <a
          href="edicion1.html"
          class="hitbox"
          id="m-edicion1"
          title="Primera edición vómito"
        ></a>
        <a
          href="edicion2.html"
          class="hitbox"
          id="m-edicion2"
          title="Edición exprés"
        ></a>
        <a
          href="https://substack.com/@acidarevista?utm_source=global-search"
          class="hitbox"
          id="m-substack"
          title="Todos los artículos"
        ></a>
        <a
          href="https://www.instagram.com/acidarevista?igsh=MXVxbm43YmwwbGpocQ=="
          class="hitbox"
          id="m-instagram"
          title="Nuestras redes"
        ></a>
      </div>
    </div>
  </body>
</html>
